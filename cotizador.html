<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Olfativa · Cotizador</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Public+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #050505;
    font-family: 'Public Sans', system-ui, sans-serif;
    color: #F5F0E8;
    overflow: hidden;
  }
  * { box-sizing: border-box; }
  deck-stage section { background: #1C1A18; }

  /* ── Top bar siempre visible ────────────────────────────── */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    height: 56px; padding: 0 20px;
    background: rgba(14, 14, 14, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(243, 237, 227, 0.1);
    display: flex; align-items: center; justify-content: space-between;
    color: #F5F0E8;
    font-family: 'Public Sans', system-ui, sans-serif;
  }
  .topbar-left, .topbar-right { display: flex; align-items: center; gap: 14px; }
  .topbar-logo {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-style: italic; font-weight: 500; font-size: 22px;
    letter-spacing: 0.01em; color: #F5F0E8;
  }
  .topbar-logo span {
    font-family: 'Inter Tight', sans-serif; font-style: normal;
    font-size: 9px; vertical-align: super; color: #CC6633; margin-left: 1px;
  }
  .topbar-divider {
    width: 1px; height: 24px;
    background: rgba(243, 237, 227, 0.15);
  }
  .topbar-meta { display: flex; flex-direction: column; gap: 2px; }
  .topbar-meta-eyebrow {
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(243, 237, 227, 0.45); font-weight: 500;
  }
  .topbar-client-display {
    color: #F5F0E8; font-size: 13.5px; font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .topbar-client-name { color: #F5F0E8; }
  .topbar-client-id { color: rgba(243, 237, 227, 0.5); font-weight: 400; font-size: 12px; }
  .btn-edit {
    background: rgba(204, 102, 51, 0.12) !important;
    border-color: rgba(204, 102, 51, 0.4) !important;
    color: #CC6633 !important;
  }
  .btn-edit:hover {
    background: rgba(204, 102, 51, 0.22) !important;
    color: #F5F0E8 !important;
  }

  .btn-primary, .btn-secondary, .btn-tertiary, .btn-download {
    appearance: none; cursor: pointer; font-family: inherit;
    border-radius: 6px; transition: all 160ms;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-primary {
    background: #CC6633; color: #1C1A18;
    border: 1px solid #CC6633;
    padding: 9px 16px; font-size: 12.5px; font-weight: 600;
    letter-spacing: 0.04em;
  }
  .btn-primary:hover { background: #d4b376; }
  .btn-secondary {
    background: rgba(243, 237, 227, 0.06);
    color: #F5F0E8;
    border: 1px solid rgba(243, 237, 227, 0.2);
    padding: 9px 14px; font-size: 12.5px; font-weight: 500;
  }
  .btn-secondary:hover { background: rgba(243, 237, 227, 0.12); }
  .btn-tertiary {
    background: transparent; color: rgba(243, 237, 227, 0.7);
    border: 1px solid rgba(243, 237, 227, 0.2);
    padding: 9px 12px; font-size: 14px;
  }
  .btn-tertiary:hover { color: #F5F0E8; border-color: rgba(243, 237, 227, 0.4); }
  /* Acción principal de descarga */
  .btn-download {
    background: #F5F0E8; color: #1C1A18;
    border: 1px solid #F5F0E8;
    padding: 9px 18px; font-size: 12.5px; font-weight: 600;
    letter-spacing: 0.04em;
  }
  .btn-download:hover { background: #CC6633; color: #1C1A18; border-color: #CC6633; }
  .btn-download.btn-download-confirm {
    padding: 12px 24px; font-size: 13px;
    letter-spacing: 0.06em;
  }
  .btn-icon { font-size: 14px; opacity: 0.85; }
  .btn-counter {
    background: rgba(14, 14, 14, 0.2); padding: 2px 7px; border-radius: 4px;
    font-size: 11px; font-weight: 500; margin-left: 4px;
    font-variant-numeric: tabular-nums;
  }

  /* ── Deck area: deja espacio para el topbar ─────────────── */
  .deck-area { position: fixed; top: 56px; left: 0; right: 0; bottom: 0; }
  deck-stage { top: 56px !important; }

  /* ── Picker overlay ─────────────────────────────────────── */
  .picker-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(5, 5, 5, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
    animation: pickerFade 200ms ease;
  }
  @keyframes pickerFade { from { opacity: 0; } to { opacity: 1; } }
  .picker-modal, .client-modal {
    background: #131210;
    border: 1px solid rgba(243, 237, 227, 0.12);
    border-radius: 10px;
    width: 100%; max-width: 1180px;
    max-height: calc(100vh - 64px);
    display: flex; flex-direction: column;
    color: #F5F0E8;
    font-family: 'Public Sans', system-ui, sans-serif;
    overflow: hidden;
  }
  .client-modal { max-width: 520px; }
  .picker-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 24px 32px; border-bottom: 1px solid rgba(243, 237, 227, 0.08);
    flex-shrink: 0;
  }
  .picker-eyebrow {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #CC6633; font-weight: 500; margin-bottom: 6px;
  }
  .picker-title {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-style: italic; font-weight: 400; font-size: 32px;
    margin: 0; letter-spacing: -0.01em; line-height: 1;
  }
  .picker-sub {
    font-size: 12px; color: rgba(243, 237, 227, 0.55);
    margin-top: 8px; line-height: 1.4;
  }
  .picker-close {
    appearance: none; background: transparent; border: 0;
    color: rgba(243, 237, 227, 0.5);
    font-size: 28px; cursor: pointer; padding: 0; line-height: 1;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; transition: all 160ms;
  }
  .picker-close:hover { color: #F5F0E8; background: rgba(243, 237, 227, 0.08); }

  .picker-presets {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 14px 32px; border-bottom: 1px solid rgba(243, 237, 227, 0.06);
    background: rgba(0, 0, 0, 0.2);
    flex-shrink: 0;
  }
  .picker-presets-label {
    font-size: 11px; color: rgba(243, 237, 227, 0.55);
    letter-spacing: 0.04em; margin-right: 4px;
  }
  .picker-preset-btn {
    appearance: none; cursor: pointer; font-family: inherit;
    background: rgba(243, 237, 227, 0.05);
    border: 1px solid rgba(243, 237, 227, 0.12);
    color: #F5F0E8; font-size: 11.5px; font-weight: 500;
    padding: 6px 11px; border-radius: 4px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 160ms;
  }
  .picker-preset-btn:hover { background: rgba(243, 237, 227, 0.1); }
  .picker-preset-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }

  .picker-grid {
    flex: 1; overflow-y: auto;
    padding: 24px 32px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
    gap: 22px;
  }
  /* Picker by TYPE: one section per kind, each with variant cards */
  .picker-sections {
    flex: 1; overflow-y: auto;
    padding: 22px 32px 32px;
    display: flex; flex-direction: column; gap: 22px;
  }
  .picker-kind {
    background: rgba(243, 237, 227, 0.025);
    border: 1px solid rgba(243, 237, 227, 0.08);
    border-radius: 8px;
    padding: 18px 20px;
    transition: border-color 160ms, background 160ms;
  }
  .picker-kind.is-on { border-color: rgba(204, 102, 51, 0.30); }
  .picker-kind.is-off { opacity: 0.78; }
  .picker-kind-head {
    display: flex; align-items: flex-start; gap: 16px;
    margin-bottom: 14px;
  }
  .picker-kind-info { flex: 1; min-width: 0; }
  .picker-kind-title-row {
    display: flex; align-items: baseline; gap: 12px;
    flex-wrap: wrap;
  }
  .picker-kind-title {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; font-weight: 500; color: #F5F0E8;
    letter-spacing: -0.01em; line-height: 1.1;
  }
  .picker-kind-status {
    font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
    font-weight: 600; padding: 3px 9px; border-radius: 999px;
  }
  .picker-kind-status.on {
    background: rgba(204, 102, 51, 0.18); color: #CC6633;
    border: 1px solid rgba(204, 102, 51, 0.4);
  }
  .picker-kind-status.off {
    background: rgba(243, 237, 227, 0.06); color: rgba(243, 237, 227, 0.45);
    border: 1px solid rgba(243, 237, 227, 0.12);
  }
  .picker-kind-desc {
    font-size: 12.5px; color: rgba(243, 237, 227, 0.55);
    line-height: 1.45; margin-top: 4px;
  }
  .picker-kind-actions {
    flex-shrink: 0; display: flex; gap: 8px;
  }
  .picker-kind-toggle {
    background: rgba(243, 237, 227, 0.06);
    color: rgba(243, 237, 227, 0.75);
    border: 1px solid rgba(243, 237, 227, 0.18);
    font-family: inherit; font-size: 11px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 9px 16px; border-radius: 4px;
    cursor: pointer;
    transition: all 160ms;
    white-space: nowrap;
  }
  .picker-kind-toggle:hover {
    background: rgba(243, 237, 227, 0.12);
    color: #F5F0E8;
  }
  .picker-kind-toggle.on {
    background: rgba(204, 102, 51, 0.18); color: #CC6633;
    border-color: rgba(204, 102, 51, 0.45);
  }
  .picker-kind-toggle.on:hover {
    background: rgba(204, 102, 51, 0.28);
  }

  /* Variantes grid (segmentos disponibles para ese tipo) */
  .picker-variants {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .picker-variant {
    position: relative;
    background: rgba(243, 237, 227, 0.03);
    border: 1px solid rgba(243, 237, 227, 0.10);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    transition: all 160ms;
  }
  .picker-variant:hover {
    border-color: rgba(204, 102, 51, 0.4);
    transform: translateY(-1px);
  }
  .picker-variant.is-selected {
    border-color: #CC6633;
    box-shadow: 0 0 0 2px rgba(204, 102, 51, 0.25);
  }
  .picker-variant .picker-card-preview {
    aspect-ratio: 16/9;
    border-bottom: 1px solid rgba(243,237,227,0.06);
  }
  .picker-kind.is-off .picker-variant:not(.is-selected) .picker-card-preview-inner {
    filter: grayscale(0.5) brightness(0.65);
  }
  .picker-variant-badge {
    position: absolute; top: 8px; right: 8px;
    background: #CC6633; color: #1C1A18;
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 2px;
    z-index: 3;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .picker-variant-check {
    position: absolute; top: 8px; left: 8px;
    width: 26px; height: 26px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #F5F0E8; font-weight: 700;
    backdrop-filter: blur(4px);
    z-index: 3;
    transition: all 160ms;
  }
  .picker-variant.is-selected .picker-variant-check {
    background: #CC6633; color: #1C1A18;
  }
  .picker-variant-foot {
    padding: 8px 10px;
    display: flex; align-items: center; gap: 8px;
    border-top: 1px solid rgba(243,237,227,0.04);
  }
  .picker-variant-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .picker-variant-name {
    flex: 1;
    font-size: 12px; font-weight: 600; color: #F5F0E8;
    letter-spacing: -0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .picker-variant-expand {
    background: transparent;
    border: 1px solid rgba(243, 237, 227, 0.14);
    color: rgba(243, 237, 227, 0.6);
    width: 26px; height: 26px;
    border-radius: 3px;
    cursor: pointer; font-family: inherit; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    transition: all 160ms;
  }
  .picker-variant-expand:hover {
    color: #F5F0E8; border-color: rgba(243, 237, 227, 0.3);
    background: rgba(243, 237, 227, 0.06);
  }

  /* Recommended preset highlight */
  .picker-preset-btn.is-recommended {
    border-color: rgba(204, 102, 51, 0.5);
    background: rgba(204, 102, 51, 0.10);
  }
  .picker-preset-tag {
    color: #CC6633; font-size: 11px; margin-left: 4px;
  }

  /* Full preview meta · segment name */
  .full-preview-meta-seg {
    color: rgba(243, 237, 227, 0.55);
    font-weight: 500;
  }
  .picker-card {
    background: rgba(243, 237, 227, 0.03);
    border: 1px solid rgba(243, 237, 227, 0.08);
    border-radius: 8px; overflow: hidden;
    display: flex; flex-direction: column;
    transition: all 200ms;
    opacity: 0.45;
  }
  .picker-card.is-on { opacity: 1; border-color: rgba(204, 102, 51, 0.35); }
  .picker-card.is-dragging { opacity: 0.4; transform: scale(0.97); cursor: grabbing; }
  .picker-card.is-dragover { border-color: #CC6633; box-shadow: 0 0 0 2px rgba(204, 102, 51, 0.4); }
  .picker-card-handle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    background: rgba(204, 102, 51, 0.08);
    border-bottom: 1px solid rgba(204, 102, 51, 0.18);
    cursor: grab; user-select: none;
  }
  .picker-card-handle:active { cursor: grabbing; }
  .handle-icon {
    color: rgba(204, 102, 51, 0.7); font-size: 13px;
    letter-spacing: -3px; font-weight: 700;
  }
  .handle-pos {
    font-size: 12px; font-weight: 600; color: #CC6633;
    font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
  }
  /* Real slide preview: container 16:9, inner is 1920x1080 scaled */
  .picker-card-preview {
    position: relative; width: 100%; aspect-ratio: 16/9;
    overflow: hidden; background: #1A1815;
    cursor: pointer; border-bottom: 1px solid rgba(243,237,227,0.06);
  }
  .picker-card-preview-inner {
    width: 1920px; height: 1080px;
    transform-origin: top left;
    pointer-events: none;
  }
  .picker-card:not(.is-on) .picker-card-preview-inner {
    filter: grayscale(0.55) brightness(0.62);
  }
  .picker-card-check {
    position: absolute; top: 12px; left: 12px; z-index: 3;
    width: 36px; height: 36px;
    background: rgba(0, 0, 0, 0.65);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #F5F0E8;
    backdrop-filter: blur(6px);
    transition: all 160ms;
  }
  .picker-card.is-on .picker-card-check {
    background: #CC6633; color: #1C1A18;
  }
  .picker-card-preview:hover .picker-card-check { transform: scale(1.06); }
  .picker-card-expand {
    position: absolute; bottom: 12px; right: 12px; z-index: 3;
    background: rgba(0, 0, 0, 0.65);
    color: #F5F0E8; border: 1px solid rgba(243, 237, 227, 0.18);
    font-family: inherit; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 6px 12px; border-radius: 3px;
    cursor: pointer; backdrop-filter: blur(6px);
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 160ms;
  }
  .picker-card-expand:hover {
    background: #CC6633; color: #1C1A18; border-color: #CC6633;
  }
  .picker-card-order {
    position: absolute; top: 12px; right: 12px; z-index: 3;
    background: rgba(0, 0, 0, 0.65);
    color: #CC6633; font-size: 11px; font-weight: 600;
    padding: 5px 9px; border-radius: 4px;
    font-variant-numeric: tabular-nums;
    backdrop-filter: blur(6px);
  }
  .picker-card-body {
    padding: 14px 14px 12px;
    display: flex; flex-direction: column; gap: 6px;
    flex: 1; position: relative;
  }
  .picker-card-label {
    font-size: 13.5px; font-weight: 600; color: #F5F0E8;
    letter-spacing: -0.01em;
  }
  .picker-card-desc {
    font-size: 11.5px; color: rgba(243, 237, 227, 0.55);
    line-height: 1.4; flex: 1;
  }
  .picker-card-controls {
    display: flex; gap: 6px; align-items: center; margin-top: 8px;
  }
  .picker-card-select {
    appearance: none; cursor: pointer; font-family: inherit;
    background: rgba(243, 237, 227, 0.06);
    border: 1px solid rgba(243, 237, 227, 0.15);
    color: #F5F0E8; font-size: 11px;
    padding: 5px 8px; border-radius: 4px; flex: 1;
  }
  .picker-card-arrows { display: flex; gap: 2px; }
  .picker-card-arrow {
    appearance: none; cursor: pointer; font-family: inherit;
    background: rgba(243, 237, 227, 0.05);
    border: 1px solid rgba(243, 237, 227, 0.12);
    color: rgba(243, 237, 227, 0.7);
    width: 24px; height: 24px;
    border-radius: 4px; font-size: 9px;
    display: flex; align-items: center; justify-content: center;
  }
  .picker-card-arrow:not(:disabled):hover { background: rgba(243, 237, 227, 0.12); }
  .picker-card-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
  .picker-card-segline {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 2px; opacity: 0.7;
  }

  /* FULL-SCREEN preview overlay (Ver grande) */
  .full-preview-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0, 0, 0, 0.94);
    display: flex; align-items: center; justify-content: center;
    padding: 48px;
    animation: fadeIn 180ms ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .full-preview-stage {
    position: relative;
    width: min(100%, calc((100vh - 96px) * 16/9));
    aspect-ratio: 16/9;
    overflow: hidden;
    background: #0E0E0E;
    box-shadow: 0 30px 90px rgba(0,0,0,0.6);
  }
  .full-preview-stage-inner {
    width: 1920px; height: 1080px;
    transform-origin: top left;
    pointer-events: none;
  }
  .full-preview-close {
    position: absolute; top: 16px; right: 16px;
    background: rgba(0,0,0,0.6); color: #F5F0E8;
    border: 1px solid rgba(243,237,227,0.2);
    width: 38px; height: 38px; border-radius: 50%;
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 4;
  }
  .full-preview-close:hover { background: #CC6633; color: #1C1A18; }
  .full-preview-meta {
    position: absolute; top: 16px; left: 16px;
    color: #F5F0E8; font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; z-index: 4;
    background: rgba(0,0,0,0.5);
    padding: 8px 14px; border-radius: 3px;
    backdrop-filter: blur(4px);
  }
  .full-preview-toggle {
    position: absolute; bottom: -56px; left: 50%;
    transform: translateX(-50%);
    background: #CC6633; color: #1C1A18;
    border: none; padding: 12px 26px; border-radius: 4px;
    font-family: inherit; font-size: 12px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer;
  }
  .full-preview-toggle.off {
    background: rgba(243,237,227,0.08); color: #F5F0E8;
    border: 1px solid rgba(243,237,227,0.18);
  }
  .full-preview-toggle:hover { background: #d97a40; }

  .picker-footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 32px;
    border-top: 1px solid rgba(243, 237, 227, 0.08);
    background: rgba(0, 0, 0, 0.3);
    flex-shrink: 0;
  }
  .picker-footer-info {
    font-size: 12px; color: rgba(243, 237, 227, 0.6);
  }
  .picker-footer-info strong { color: #CC6633; font-weight: 600; }
  .picker-footer-btns { display: flex; gap: 8px; }

  /* ── Client modal fields ────────────────────────────────── */
  .client-fields {
    padding: 20px 32px; display: flex; flex-direction: column; gap: 14px;
  }
  .client-field { display: flex; flex-direction: column; gap: 6px; }
  .client-field-label {
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(243, 237, 227, 0.55); font-weight: 500;
  }
  .client-field-input {
    appearance: none; font-family: inherit;
    background: rgba(243, 237, 227, 0.06);
    border: 1px solid rgba(243, 237, 227, 0.18);
    color: #F5F0E8; font-size: 14px;
    padding: 10px 12px; border-radius: 5px; outline: none;
    transition: border-color 160ms;
  }
  .client-field-input:focus { border-color: #CC6633; background: rgba(204, 102, 51, 0.06); }
