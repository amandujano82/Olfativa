<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Olfativa · Cotizador</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Public+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #050505;
    font-family: 'Public Sans', system-ui, sans-serif;
    color: #F5F0E8;
    overflow: hidden;
  }
  * { box-sizing: border-box; }
  deck-stage section { background: #1C1A18; }

  /* ── Top bar siempre visible ────────────────────────────── */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    height: 56px; padding: 0 20px;
    background: rgba(14, 14, 14, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(243, 237, 227, 0.1);
    display: flex; align-items: center; justify-content: space-between;
    color: #F5F0E8;
    font-family: 'Public Sans', system-ui, sans-serif;
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .topbar-right { display: flex; align-items: center; gap: 4px; }
  .topbar-logo {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-style: italic; font-weight: 500; font-size: 22px;
    letter-spacing: 0.01em; color: #F5F0E8;
  }
  .topbar-logo span {
    font-family: 'Inter Tight', sans-serif; font-style: normal;
    font-size: 9px; vertical-align: super; color: #CC6633; margin-left: 1px;
  }
  .topbar-divider {
    width: 1px; height: 22px;
    background: rgba(243, 237, 227, 0.15);
  }
  .topbar-meta { display: flex; flex-direction: column; gap: 1px; }
  .topbar-meta-eyebrow {
    font-size: 8.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(243, 237, 227, 0.38); font-weight: 500;
  }
  .topbar-client-display {
    font-size: 12px; font-weight: 500;
    display: flex; align-items: center; gap: 5px;
  }
  .topbar-client-name { color: rgba(243, 237, 227, 0.92); }
  .topbar-client-id { color: rgba(243, 237, 227, 0.4); font-weight: 400; font-size: 10.5px; }

  .btn-primary, .btn-secondary, .btn-tertiary, .btn-download {
    appearance: none; cursor: pointer; font-family: inherit;
    border-radius: 4px; transition: all 160ms;
    display: inline-flex; align-items: center; gap: 8px;
  }
  /* Láminas en topbar + primarios de modales · fondo naranja primario */
  .btn-primary {
    background: #CC6633; color: #1C1A18;
    border: 1px solid #CC6633;
    padding: 9px 16px; font-size: 12.5px; font-weight: 600;
    letter-spacing: 0.04em;
  }
  .btn-primary:hover { background: #d97a4a; border-color: #d97a4a; }
  /* Variante grande para botones primarios dentro de modales (Listo,
     Aplicar y ver slide, Subir y agregar al deck, etc.) */
  .picker-footer-btns .btn-primary,
  .admin-form-actions .btn-primary {
    padding: 12px 24px; font-size: 14px;
  }
  /* Botones secundarios en modales · ghost con leve borde para affordance */
  .picker-footer-btns .btn-secondary,
  .admin-form-actions .btn-secondary {
    padding: 11px 18px; font-size: 13px;
    border-color: rgba(243, 237, 227, 0.14);
    color: rgba(243, 237, 227, 0.7);
  }
  .picker-footer-btns .btn-secondary:hover,
  .admin-form-actions .btn-secondary:hover {
    border-color: rgba(243, 237, 227, 0.3);
    color: #F5F0E8; background: rgba(243, 237, 227, 0.04);
  }
  /* Ghost · Cliente, Scent Advisor, Precios, Admin — sin borde, hover sutil */
  .btn-secondary {
    background: transparent; color: rgba(243, 237, 227, 0.78);
    border: 1px solid transparent;
    padding: 8px 12px; font-size: 12.5px; font-weight: 500;
    letter-spacing: 0.01em;
  }
  .btn-secondary:hover {
    background: rgba(243, 237, 227, 0.05);
    color: #F5F0E8;
  }
  /* Reset — aislado tras separador, opacidad baja hasta hover */
  .btn-tertiary {
    background: transparent; color: rgba(243, 237, 227, 0.55);
    border: 1px solid rgba(243, 237, 227, 0.12);
    padding: 7px 11px; font-size: 14px;
    opacity: 0.6;
  }
  .btn-tertiary:hover {
    color: #F5F0E8; border-color: rgba(243, 237, 227, 0.3);
    opacity: 1;
  }
  /* Descargar — CTA final · fondo bone */
  .btn-download {
    background: rgba(243, 237, 227, 0.92); color: #1C1A18;
    border: 1px solid rgba(243, 237, 227, 0.92);
    padding: 9px 18px; font-size: 12.5px; font-weight: 600;
    letter-spacing: 0.04em;
  }
  .btn-download:hover { background: #fff; color: #0E0E0E; border-color: #fff; }
  .btn-download.btn-download-confirm {
    padding: 12px 24px; font-size: 13px;
    letter-spacing: 0.06em;
  }
  /* Separador vertical entre Descargar y Reset */
  .topbar-reset-divider {
    width: 1px; height: 22px;
    background: rgba(243, 237, 227, 0.15);
    margin: 0 4px 0 8px;
  }
  .btn-icon { font-size: 14px; opacity: 0.85; }
  .btn-counter {
    background: rgba(14, 14, 14, 0.2); padding: 2px 7px; border-radius: 4px;
    font-size: 11px; font-weight: 500; margin-left: 4px;
    font-variant-numeric: tabular-nums;
  }

  /* Coach mark · banner discreto en el primer ingreso */
  .coach-mark {
    position: fixed;
    top: 68px; left: 50%; transform: translateX(-50%);
    z-index: 90;
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px 8px 16px;
    background: rgba(20, 19, 17, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(199, 166, 104, 0.28);
    border-radius: 999px;
    color: rgba(243, 237, 227, 0.85);
    font-family: 'Public Sans', system-ui, sans-serif;
    font-size: 12px; letter-spacing: 0.02em;
    animation: coachIn 280ms ease;
    max-width: calc(100vw - 64px);
  }
  @keyframes coachIn {
    from { opacity: 0; transform: translate(-50%, -6px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  .coach-mark .coach-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #CC6633; flex-shrink: 0;
  }
  .coach-mark .coach-step {
    color: rgba(199, 166, 104, 0.9);
    font-weight: 500;
  }
  .coach-mark .coach-sep {
    color: rgba(243, 237, 227, 0.3);
    margin: 0 2px;
  }
  .coach-mark .coach-close {
    appearance: none; background: transparent; border: 0;
    color: rgba(243, 237, 227, 0.5);
    font-size: 18px; cursor: pointer; padding: 0 4px;
    line-height: 1; margin-left: 4px;
  }
  .coach-mark .coach-close:hover { color: #F5F0E8; }

  /* Soft tip · toast con acción cuando saltas un paso */
  .soft-tip {
    position: fixed;
    top: 72px; right: 24px;
    z-index: 250;
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 14px;
    background: rgba(20, 19, 17, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(199, 166, 104, 0.28);
    border-radius: 8px;
    color: rgba(243, 237, 227, 0.92);
    font-family: 'Public Sans', system-ui, sans-serif;
    font-size: 12.5px; line-height: 1.45;
    max-width: 340px;
    animation: softTipIn 220ms ease;
  }
  @keyframes softTipIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .soft-tip-body { flex: 1; }
  .soft-tip-eyebrow {
    font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(199, 166, 104, 0.85); font-weight: 600;
    margin-bottom: 4px;
  }
  .soft-tip-actions {
    display: flex; gap: 8px; margin-top: 10px;
  }
  .soft-tip-actions button {
    appearance: none; cursor: pointer; font-family: inherit;
    font-size: 11.5px; padding: 6px 10px; border-radius: 4px;
    letter-spacing: 0.02em;
  }
  .soft-tip-actions .soft-tip-primary {
    background: #CC6633; color: #1C1A18; border: 1px solid #CC6633;
    font-weight: 600;
  }
  .soft-tip-actions .soft-tip-primary:hover { background: #d97a4a; border-color: #d97a4a; }
  .soft-tip-actions .soft-tip-ghost {
    background: transparent; color: rgba(243, 237, 227, 0.7);
    border: 1px solid rgba(243, 237, 227, 0.18);
  }
  .soft-tip-actions .soft-tip-ghost:hover { color: #F5F0E8; border-color: rgba(243, 237, 227, 0.36); }
  .soft-tip-close {
    appearance: none; background: transparent; border: 0;
    color: rgba(243, 237, 227, 0.4);
    font-size: 16px; cursor: pointer; padding: 0 0 0 4px;
    line-height: 1;
  }
  .soft-tip-close:hover { color: #F5F0E8; }

  /* ── Deck area: deja espacio para el topbar ─────────────── */
  .deck-area { position: fixed; top: 56px; left: 0; right: 0; bottom: 0; }
  deck-stage { top: 56px !important; }

  /* ── Picker overlay ─────────────────────────────────────── */
  .picker-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(5, 5, 5, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
    animation: pickerFade 200ms ease;
  }
  @keyframes pickerFade { from { opacity: 0; } to { opacity: 1; } }
  .picker-modal, .client-modal {
    background: #131210;
    border: 1px solid rgba(243, 237, 227, 0.12);
    border-radius: 10px;
    width: 100%; max-width: 1180px;
    max-height: calc(100vh - 64px);
    display: flex; flex-direction: column;
    color: #F5F0E8;
    font-family: 'Public Sans', system-ui, sans-serif;
    overflow: hidden;
  }
  .client-modal { max-width: 520px; }
  .picker-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 24px 32px; border-bottom: 1px solid rgba(243, 237, 227, 0.08);
    flex-shrink: 0;
  }
  .picker-eyebrow {
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(199, 166, 104, 0.7); font-weight: 600; margin-bottom: 6px;
  }
  .picker-title {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-style: italic; font-weight: 400; font-size: 32px;
    margin: 0; letter-spacing: -0.01em; line-height: 1;
  }
  .picker-sub {
    font-size: 12px; color: rgba(243, 237, 227, 0.55);
    margin-top: 8px; line-height: 1.4;
  }
  .picker-close {
    appearance: none; background: transparent; border: 0;
    color: rgba(243, 237, 227, 0.5);
    font-size: 28px; cursor: pointer; padding: 0; line-height: 1;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; transition: all 160ms;
  }
  .picker-close:hover { color: #F5F0E8; background: rgba(243, 237, 227, 0.08); }

  .picker-presets {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 14px 32px; border-bottom: 1px solid rgba(243, 237, 227, 0.06);
    background: rgba(0, 0, 0, 0.2);
    flex-shrink: 0;
  }
  .picker-presets-label {
    font-size: 11px; color: rgba(243, 237, 227, 0.55);
    letter-spacing: 0.04em; margin-right: 4px;
  }
  .picker-preset-btn {
    appearance: none; cursor: pointer; font-family: inherit;
    background: rgba(243, 237, 227, 0.05);
    border: 1px solid rgba(243, 237, 227, 0.12);
    color: #F5F0E8; font-size: 11.5px; font-weight: 500;
    padding: 6px 11px; border-radius: 4px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 160ms;
  }
  .picker-preset-btn:hover { background: rgba(243, 237, 227, 0.1); }
  .picker-preset-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }

  .picker-grid {
    flex: 1; overflow-y: auto;
    padding: 24px 32px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
    gap: 22px;
  }
  /* Picker by TYPE: one section per kind, each with variant cards */
  .picker-sections {
    flex: 1; overflow-y: auto;
    padding: 22px 32px 32px;
    display: flex; flex-direction: column; gap: 22px;
  }
  .picker-kind {
    background: rgba(243, 237, 227, 0.025);
    border: 1px solid rgba(243, 237, 227, 0.08);
    border-radius: 8px;
    padding: 18px 20px;
    transition: border-color 160ms, background 160ms;
  }
  .picker-kind.is-on { border-color: rgba(199, 166, 104, 0.35); }
  .picker-kind.is-off { opacity: 0.78; }
  .picker-kind-head {
    display: flex; align-items: flex-start; gap: 16px;
    margin-bottom: 14px;
  }
  .picker-kind-info { flex: 1; min-width: 0; }
  .picker-kind-title-row {
    display: flex; align-items: baseline; gap: 12px;
    flex-wrap: wrap;
  }
  .picker-kind-title {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; font-weight: 500; color: #F5F0E8;
    letter-spacing: -0.01em; line-height: 1.1;
  }
  .picker-kind-status {
    font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .picker-kind-status.on {
    color: #8FB37E;
    background: transparent; border: 0; padding: 0;
  }
  .picker-kind-status.on::before {
    content: '✓';
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px;
    background: rgba(143, 179, 126, 0.18);
    color: #8FB37E;
    border-radius: 50%; font-size: 9px; font-weight: 700;
    letter-spacing: 0;
  }
  .picker-kind-status.off {
    color: rgba(243, 237, 227, 0.42);
    background: transparent; border: 0; padding: 0;
  }
  .picker-kind-desc {
    font-size: 12.5px; color: rgba(243, 237, 227, 0.55);
    line-height: 1.45; margin-top: 4px;
  }
  .picker-kind-actions {
    flex-shrink: 0; display: flex; gap: 8px;
  }
  .picker-kind-toggle {
    background: rgba(243, 237, 227, 0.06);
    color: rgba(243, 237, 227, 0.75);
    border: 1px solid rgba(243, 237, 227, 0.18);
    font-family: inherit; font-size: 11px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 9px 16px; border-radius: 4px;
    cursor: pointer;
    transition: all 160ms;
    white-space: nowrap;
  }
  .picker-kind-toggle:hover {
    background: rgba(243, 237, 227, 0.12);
    color: #F5F0E8;
  }
  .picker-kind-toggle.on {
    background: rgba(199, 166, 104, 0.1); color: rgba(199, 166, 104, 0.95);
    border-color: rgba(199, 166, 104, 0.35);
  }
  .picker-kind-toggle.on:hover {
    background: rgba(199, 166, 104, 0.18);
  }

  /* Variantes grid (segmentos disponibles para ese tipo) */
  .picker-variants {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .picker-variant {
    position: relative;
    background: rgba(243, 237, 227, 0.03);
    border: 1px solid rgba(243, 237, 227, 0.10);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    transition: all 160ms;
  }
  .picker-variant:hover {
    border-color: rgba(199, 166, 104, 0.35);
    transform: translateY(-1px);
  }
  .picker-variant.is-selected {
    border-color: rgba(199, 166, 104, 0.55);
    box-shadow: 0 0 0 1px rgba(199, 166, 104, 0.2);
  }
  .picker-variant .picker-card-preview {
    aspect-ratio: 16/9;
    border-bottom: 1px solid rgba(243,237,227,0.06);
  }
  .picker-kind.is-off .picker-variant:not(.is-selected) .picker-card-preview-inner {
    filter: grayscale(0.5) brightness(0.65);
  }
  .picker-variant-badge {
    position: absolute; top: 8px; right: 8px;
    background: rgba(199, 166, 104, 0.92); color: #1C1A18;
    font-size: 9px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 2px;
    z-index: 3;
  }
  .picker-variant-check {
    position: absolute; top: 8px; left: 8px;
    width: 26px; height: 26px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #F5F0E8; font-weight: 700;
    backdrop-filter: blur(4px);
    z-index: 3;
    transition: all 160ms;
  }
  .picker-variant.is-selected .picker-variant-check {
    background: #CC6633; color: #1C1A18;
  }
  .picker-variant-foot {
    padding: 8px 10px;
    display: flex; align-items: center; gap: 8px;
    border-top: 1px solid rgba(243,237,227,0.04);
  }
  .picker-variant-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .picker-variant-name {
    flex: 1;
    font-size: 12px; font-weight: 600; color: #F5F0E8;
    letter-spacing: -0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .picker-variant-expand {
    background: transparent;
    border: 1px solid rgba(243, 237, 227, 0.14);
    color: rgba(243, 237, 227, 0.6);
    width: 26px; height: 26px;
    border-radius: 3px;
    cursor: pointer; font-family: inherit; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    transition: all 160ms;
  }
  .picker-variant-expand:hover {
    color: #F5F0E8; border-color: rgba(243, 237, 227, 0.3);
    background: rgba(243, 237, 227, 0.06);
  }

  /* Recommended preset highlight · hairline bone + tag dorado */
  .picker-preset-btn.is-recommended {
    border-color: rgba(234, 226, 213, 0.1);
    background: rgba(234, 226, 213, 0.04);
  }
  .picker-preset-tag {
    color: #CC6633; font-size: 11px; margin-left: 4px;
  }

  /* Full preview meta · segment name */
  .full-preview-meta-seg {
    color: rgba(243, 237, 227, 0.55);
    font-weight: 500;
  }
  .picker-card {
    background: rgba(243, 237, 227, 0.03);
    border: 1px solid rgba(243, 237, 227, 0.08);
    border-radius: 8px; overflow: hidden;
    display: flex; flex-direction: column;
    transition: all 200ms;
    opacity: 0.45;
  }
  .picker-card.is-on { opacity: 1; border-color: rgba(199, 166, 104, 0.35); }
  .picker-card.is-dragging { opacity: 0.4; transform: scale(0.97); cursor: grabbing; }
  .picker-card.is-dragover { border-color: #CC6633; box-shadow: 0 0 0 2px rgba(204, 102, 51, 0.4); }
  .picker-card-handle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    background: rgba(204, 102, 51, 0.08);
    border-bottom: 1px solid rgba(204, 102, 51, 0.18);
    cursor: grab; user-select: none;
  }
  .picker-card-handle:active { cursor: grabbing; }
  .handle-icon {
    color: rgba(204, 102, 51, 0.7); font-size: 13px;
    letter-spacing: -3px; font-weight: 700;
  }
  .handle-pos {
    font-size: 12px; font-weight: 600; color: #CC6633;
    font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
  }
  /* Real slide preview: container 16:9, inner is 1920x1080 scaled */
  .picker-card-preview {
    position: relative; width: 100%; aspect-ratio: 16/9;
    overflow: hidden; background: #1A1815;
    cursor: pointer; border-bottom: 1px solid rgba(243,237,227,0.06);
  }
  .picker-card-preview-inner {
    width: 1920px; height: 1080px;
    transform-origin: top left;
    pointer-events: none;
  }
  .picker-card:not(.is-on) .picker-card-preview-inner {
    filter: grayscale(0.55) brightness(0.62);
  }
  .picker-card-check {
    position: absolute; top: 12px; left: 12px; z-index: 3;
    width: 36px; height: 36px;
    background: rgba(0, 0, 0, 0.65);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #F5F0E8;
    backdrop-filter: blur(6px);
    transition: all 160ms;
  }
  .picker-card.is-on .picker-card-check {
    background: #CC6633; color: #1C1A18;
  }
  .picker-card-preview:hover .picker-card-check { transform: scale(1.06); }
  .picker-card-expand {
    position: absolute; bottom: 12px; right: 12px; z-index: 3;
    background: rgba(0, 0, 0, 0.65);
    color: #F5F0E8; border: 1px solid rgba(243, 237, 227, 0.18);
    font-family: inherit; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 6px 12px; border-radius: 3px;
    cursor: pointer; backdrop-filter: blur(6px);
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 160ms;
  }
  .picker-card-expand:hover {
    background: #CC6633; color: #1C1A18; border-color: #CC6633;
  }
  .picker-card-order {
    position: absolute; top: 12px; right: 12px; z-index: 3;
    background: rgba(0, 0, 0, 0.65);
    color: #CC6633; font-size: 11px; font-weight: 600;
    padding: 5px 9px; border-radius: 4px;
    font-variant-numeric: tabular-nums;
    backdrop-filter: blur(6px);
  }
  .picker-card-body {
    padding: 14px 14px 12px;
    display: flex; flex-direction: column; gap: 6px;
    flex: 1; position: relative;
  }
  .picker-card-label {
    font-size: 13.5px; font-weight: 600; color: #F5F0E8;
    letter-spacing: -0.01em;
  }
  .picker-card-desc {
    font-size: 11.5px; color: rgba(243, 237, 227, 0.55);
    line-height: 1.4; flex: 1;
  }
  .picker-card-controls {
    display: flex; gap: 6px; align-items: center; margin-top: 8px;
  }
  .picker-card-select {
    appearance: none; cursor: pointer; font-family: inherit;
    background: rgba(243, 237, 227, 0.06);
    border: 1px solid rgba(243, 237, 227, 0.15);
    color: #F5F0E8; font-size: 11px;
    padding: 5px 8px; border-radius: 4px; flex: 1;
  }
  .picker-card-arrows { display: flex; gap: 2px; }
  .picker-card-arrow {
    appearance: none; cursor: pointer; font-family: inherit;
    background: rgba(243, 237, 227, 0.05);
    border: 1px solid rgba(243, 237, 227, 0.12);
    color: rgba(243, 237, 227, 0.7);
    width: 24px; height: 24px;
    border-radius: 4px; font-size: 9px;
    display: flex; align-items: center; justify-content: center;
  }
  .picker-card-arrow:not(:disabled):hover { background: rgba(243, 237, 227, 0.12); }
  .picker-card-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
  .picker-card-segline {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 2px; opacity: 0.7;
  }

  /* FULL-SCREEN preview overlay (Ver grande) */
  .full-preview-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0, 0, 0, 0.94);
    display: flex; align-items: center; justify-content: center;
    padding: 48px;
    animation: fadeIn 180ms ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .full-preview-stage {
    position: relative;
    width: min(100%, calc((100vh - 96px) * 16/9));
    aspect-ratio: 16/9;
    overflow: hidden;
    background: #0E0E0E;
    box-shadow: 0 30px 90px rgba(0,0,0,0.6);
  }
  .full-preview-stage-inner {
    width: 1920px; height: 1080px;
    transform-origin: top left;
    pointer-events: none;
  }
  .full-preview-close {
    position: absolute; top: 16px; right: 16px;
    background: rgba(0,0,0,0.6); color: #F5F0E8;
    border: 1px solid rgba(243,237,227,0.2);
    width: 38px; height: 38px; border-radius: 50%;
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 4;
  }
  .full-preview-close:hover { background: #CC6633; color: #1C1A18; }
  .full-preview-meta {
    position: absolute; top: 16px; left: 16px;
    color: #F5F0E8; font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; z-index: 4;
    background: rgba(0,0,0,0.5);
    padding: 8px 14px; border-radius: 3px;
    backdrop-filter: blur(4px);
  }
  .full-preview-toggle {
    position: absolute; bottom: -56px; left: 50%;
    transform: translateX(-50%);
    background: #CC6633; color: #1C1A18;
    border: none; padding: 12px 26px; border-radius: 4px;
    font-family: inherit; font-size: 12px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer;
  }
  .full-preview-toggle.off {
    background: rgba(243,237,227,0.08); color: #F5F0E8;
    border: 1px solid rgba(243,237,227,0.18);
  }
  .full-preview-toggle:hover { background: #d97a40; }

  .picker-footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 32px;
    border-top: 1px solid rgba(243, 237, 227, 0.08);
    background: rgba(0, 0, 0, 0.3);
    flex-shrink: 0;
  }
  .picker-footer-info {
    font-size: 12px; color: rgba(243, 237, 227, 0.6);
  }
  .picker-footer-info strong { color: #CC6633; font-weight: 600; }
  .picker-footer-btns { display: flex; gap: 8px; }

  /* ── Client modal fields ────────────────────────────────── */
  .client-fields {
    padding: 20px 32px; display: flex; flex-direction: column; gap: 14px;
  }
  .client-field { display: flex; flex-direction: column; gap: 6px; }
  .client-field-label {
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(243, 237, 227, 0.55); font-weight: 500;
  }
  .client-field-input {
    appearance: none; font-family: inherit;
    background: rgba(243, 237, 227, 0.06);
    border: 1px solid rgba(243, 237, 227, 0.18);
    color: #F5F0E8; font-size: 14px;
    padding: 10px 12px; border-radius: 5px; outline: none;
    transition: border-color 160ms;
  }
  .client-field-input:focus { border-color: #CC6633; background: rgba(204, 102, 51, 0.06); }

  /* ── Prices modal ───────────────────────────────────────── */
  .prices-modal {
    background: #131210;
    border: 1px solid rgba(243, 237, 227, 0.12);
    border-radius: 10px;
    width: 100%; max-width: 720px;
    max-height: calc(100vh - 64px);
    display: flex; flex-direction: column;
    color: #F5F0E8;
    font-family: 'Public Sans', system-ui, sans-serif;
    overflow: hidden;
  }
  .prices-body {
    flex: 1; overflow-y: auto;
    padding: 4px 32px 12px;
    display: flex; flex-direction: column;
  }
  /* Secciones sin caja · hairline horizontal + label gold caps */
  .prices-section {
    padding: 18px 0 6px;
    background: transparent;
    border: 0;
    border-top: 1px solid rgba(243, 237, 227, 0.1);
  }
  .prices-section:first-child { border-top: 0; padding-top: 14px; }
  .prices-section-label {
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(199, 166, 104, 0.7); font-weight: 600; margin-bottom: 12px;
  }
  .prices-line {
    display: grid; grid-template-columns: 24px 1fr 70px 110px;
    gap: 8px; align-items: center;
    padding: 6px 0; position: relative;
    transition: background 160ms;
  }
  .prices-line.is-unit {
    grid-template-columns: 24px 1fr 60px 75px 100px;
  }
  .prices-line.is-warn {
    background: rgba(194,119,107,0.06);
    border-radius: 5px; padding: 6px 8px;
  }
  .prices-line-disc {
    display: flex; align-items: baseline; gap: 2px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(243,237,227,0.18);
    border-radius: 5px; padding: 5px 6px;
  }
  .prices-line-disc input {
    appearance: none; font-family: inherit;
    background: transparent; border: 0;
    color: #F5F0E8; font-size: 14px; font-weight: 600;
    width: 38px; padding: 0; outline: none;
    text-align: center; font-variant-numeric: tabular-nums;
  }
  .prices-line-disc span { color: rgba(243,237,227,0.5); font-size: 12px; }
  .prices-line-auth {
    font-size: 9px; color: #C2776B; font-weight: 600;
    margin-top: 2px; letter-spacing: 0.04em;
  }

  /* Toggle de modo descuento */
  .prices-mode-toggle {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    margin-bottom: 4px;
  }
  .prices-mode-btn {
    appearance: none; cursor: pointer; font-family: inherit;
    background: rgba(243,237,227,0.05);
    border: 1px solid rgba(243,237,227,0.15);
    color: rgba(243,237,227,0.7); font-size: 11.5px; font-weight: 500;
    padding: 9px 10px; border-radius: 5px;
    transition: all 160ms;
  }
  .prices-mode-btn:hover {
    background: rgba(243,237,227,0.1); color: #F5F0E8;
  }
  .prices-mode-btn.is-on {
    background: #CC6633; color: #1C1A18;
    border-color: #CC6633; font-weight: 600;
  }
  .prices-disc-l-text {
    font-size: 12px; color: rgba(243,237,227,0.7);
    letter-spacing: 0.04em;
  }
  .prices-line-rm {
    appearance: none; background: transparent; border: 0;
    color: rgba(243,237,227,0.4); font-size: 18px; cursor: pointer;
    width: 24px; padding: 0;
  }
  .prices-line-rm:hover { color: #C2776B; }
  .prices-line-sel, .prices-line-cant {
    appearance: none; font-family: inherit;
    background: rgba(243,237,227,0.08);
    border: 1px solid rgba(243,237,227,0.18);
    color: #F5F0E8; font-size: 13px;
    padding: 8px 10px; border-radius: 5px; outline: none;
  }
  .prices-line-cant { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
  .prices-line-sub {
    text-align: right; font-size: 16px; font-weight: 600;
    color: #CC6633; font-variant-numeric: tabular-nums;
  }
  .prices-line-sub span { font-size: 11px; color: rgba(243,237,227,0.5); font-weight: 400; }
  .prices-add {
    appearance: none; cursor: pointer; font-family: inherit;
    width: 100%; padding: 10px; margin-top: 8px;
    background: transparent; color: #CC6633;
    border: 1px dashed rgba(199,166,104,0.4); border-radius: 6px;
    font-size: 12px; font-weight: 500; letter-spacing: 0.04em;
  }
  .prices-add:hover { background: rgba(199,166,104,0.06); }

  .prices-disc { transition: all 200ms; position: relative; }
  .prices-disc.is-warn { background: rgba(194,119,107,0.04); border-radius: 4px; padding-left: 12px; padding-right: 12px; }
  .prices-disc.is-warn::before {
    content: ''; position: absolute; left: 0; top: 18px; bottom: 6px;
    width: 2px; background: rgba(194,119,107,0.55); border-radius: 1px;
  }
  .prices-disc.is-ok::before { display: none; }
  .prices-disc-row {
    display: flex; justify-content: space-between; align-items: center; gap: 14px;
  }
  .prices-disc-hint {
    font-size: 11px; color: rgba(243,237,227,0.55); margin-top: 4px;
  }
  .prices-disc-hint b { color: #F5F0E8; }
  .prices-disc-input {
    display: flex; align-items: baseline; gap: 4px;
    background: rgba(0,0,0,0.4); border-radius: 6px; padding: 6px 12px;
  }
  .prices-disc-input input {
    appearance: none; background: transparent; border: 0;
    color: #F5F0E8; font-family: inherit;
    font-size: 26px; font-weight: 600; outline: none;
    width: 64px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .prices-disc-input span { font-size: 16px; color: rgba(243,237,227,0.5); }
  .prices-auth {
    margin-top: 10px; padding: 8px 12px;
    background: rgba(194,119,107,0.15);
    border: 1px solid #C2776B; border-radius: 5px;
    color: #C2776B; font-size: 12px;
  }
  .prices-auth b { color: #F5F0E8; }
  .prices-toggle {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: rgba(243,237,227,0.85);
    cursor: pointer; padding: 6px 0;
  }
  .prices-toggle input { accent-color: #CC6633; width: 14px; height: 14px; }
  .prices-toggle b { color: #F5F0E8; }
  .prices-toggle .muted { color: rgba(243,237,227,0.5); }

  .prices-totals { display: flex; flex-direction: column; gap: 4px; }
  .prices-total-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 4px 0; font-size: 13px; color: rgba(243,237,227,0.75);
  }
  .prices-total-row span:last-child { font-variant-numeric: tabular-nums; font-weight: 500; color: #F5F0E8; }
  .prices-total-row.grand {
    margin-top: 8px; padding-top: 10px;
    border-top: 1px solid rgba(199,166,104,0.4);
    font-size: 17px; font-weight: 600; color: #CC6633;
  }
  .prices-total-row.grand span:last-child { color: #CC6633; font-size: 22px; font-weight: 600; }
  .prices-total-row.sub { font-size: 11px; color: rgba(243,237,227,0.5); }

  .prices-fp { display: flex; flex-direction: column; gap: 2px; }
  .prices-notas {
    appearance: none; font-family: inherit;
    background: rgba(243,237,227,0.08);
    border: 1px solid rgba(243,237,227,0.2);
    color: #F5F0E8; font-size: 13px;
    padding: 8px 10px; border-radius: 5px; outline: none;
    width: 100%; margin-top: 8px; resize: vertical;
  }
  .prices-notas:focus { border-color: #CC6633; }

  /* ── Scent Advisor (interno: scent-iq) — panel dentro del cotizador ── */
  .scent-iq-modal { max-width: 1280px; }
  .picker-body { overflow-y: auto; padding: 24px 32px 28px; flex: 1; }
  .siq-body { color: #F5F0E8; }
  .siq-eyebrow {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #C9A84C; font-weight: 600; margin-bottom: 8px;
  }
  .siq-muted { color: rgba(243,237,227,0.4); }

  /* — Uploader — */
  .siq-uploader { display: flex; flex-direction: column; gap: 16px; }
  /* Tipo de espacio · obligatorio antes de analizar */
  .siq-space-type {
    display: flex; flex-direction: column; gap: 8px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(234, 226, 213, 0.1);
  }
  .siq-space-type-label {
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(199, 166, 104, 0.7); font-weight: 600;
  }
  .siq-space-type-label .siq-req { color: #CC6633; margin-left: 2px; }
  .siq-space-type-select {
    appearance: none; font-family: inherit;
    background: rgba(243,237,227,0.06);
    border: 1px solid rgba(234, 226, 213, 0.18);
    color: #F5F0E8; font-size: 14px;
    padding: 11px 14px; border-radius: 5px; outline: none;
    cursor: pointer;
  }
  .siq-space-type-select:focus { border-color: rgba(199, 166, 104, 0.55); background: rgba(199, 166, 104, 0.06); }
  .siq-space-type-hint {
    font-size: 12px; color: rgba(243,237,227,0.55); line-height: 1.4;
  }
  .siq-drop {
    border: 2px dashed rgba(201,168,76,0.35);
    background: rgba(201,168,76,0.04);
    border-radius: 10px;
    padding: 60px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 160ms ease;
    min-height: 280px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .siq-drop:hover, .siq-drop.is-drag {
    border-color: #C9A84C; background: rgba(201,168,76,0.1);
  }
  .siq-drop.is-locked {
    opacity: 0.55; cursor: not-allowed;
    border-color: rgba(234, 226, 213, 0.12); background: rgba(234, 226, 213, 0.02);
  }
  .siq-drop.is-locked:hover { border-color: rgba(234, 226, 213, 0.12); background: rgba(234, 226, 213, 0.02); }
  .siq-drop.has-preview { padding: 12px; }
  .siq-drop-icon {
    font-size: 36px; color: #C9A84C; margin-bottom: 14px;
    width: 56px; height: 56px; border: 1px solid rgba(201,168,76,0.4); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .siq-drop-title {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-style: italic; font-size: 24px; margin-bottom: 6px;
  }
  .siq-drop-sub { font-size: 13px; color: rgba(243,237,227,0.55); }
  .siq-preview { max-width: 100%; max-height: 480px; border-radius: 6px; object-fit: contain; background: #111; padding: 8px; }
  .siq-uploader-actions {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    border-top: 1px solid rgba(243,237,227,0.1); padding-top: 16px;
  }
  .siq-uploader-note { font-size: 12px; color: rgba(243,237,227,0.55); max-width: 60%; }
  .siq-uploader-note code {
    font-family: 'Courier New', monospace;
    background: rgba(243,237,227,0.06); padding: 1px 6px; border-radius: 3px;
    color: #C9A84C;
  }

  /* — Analyzing — */
  .siq-analyzing {
    display: flex; align-items: center; gap: 28px; padding: 24px 0;
  }
  .siq-analyzing-img {
    max-width: 360px; max-height: 240px;
    object-fit: contain; background: #111; padding: 8px; border-radius: 6px;
  }
  .siq-analyzing-text { display: flex; flex-direction: column; gap: 8px; }
  .siq-spinner {
    width: 36px; height: 36px;
    border: 2px solid rgba(201,168,76,0.2);
    border-top-color: #C9A84C;
    border-radius: 50%;
    animation: siqSpin 0.9s linear infinite;
    margin-bottom: 8px;
  }
  @keyframes siqSpin { to { transform: rotate(360deg); } }
  .siq-step {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-style: italic; font-size: 22px;
  }

  /* — Photo evidence: render estilo Microsoft Designer (marco crema) — */
  .siq-evidence {
    display: flex; flex-direction: column; gap: 14px;
  }
  /* Marco crema, padding generoso, look hospitality premium */
  .siq-designer {
    position: relative;
    background: #f4ede0;
    color: #1c1a18;
    border-radius: 10px;
    padding: 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    container-type: inline-size;
  }
  .siq-designer-head {
    text-align: center;
    margin-bottom: 18px;
  }
  .siq-designer-title {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(22px, 3.4cqw, 40px);
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: #1c1a18;
  }
  .siq-designer-sub {
    font-family: 'Public Sans', system-ui, sans-serif;
    font-size: clamp(11px, 1.1cqw, 14px);
    letter-spacing: 0.08em;
    color: rgba(28,26,24,0.6);
    margin-top: 6px;
  }
  /* Body: 3 columnas [bullets izq 22%][foto 56%][bullets der 22%] */
  .siq-designer-body {
    display: grid;
    grid-template-columns: 22% 56% 22%;
    gap: 16px;
    align-items: center;
  }
  @media (max-width: 900px) {
    .siq-designer-body {
      grid-template-columns: 1fr;
    }
  }
  /* Foto al centro: object-fit contain SIEMPRE, fondo crema oscuro */
  .siq-designer-photo {
    background: #1c1a18;
    border-radius: 6px;
    overflow: hidden;
    width: 100%;
    max-height: 520px;
    display: flex; align-items: center; justify-content: center;
  }
  .siq-designer-img {
    display: block;
    width: 100%; height: 100%;
    object-fit: contain;       /* NUNCA cover — regla critica del proyecto */
    object-position: center;
  }
  .siq-designer-placeholder {
    color: rgba(245,240,232,0.4);
    font-size: 13px;
    font-style: italic;
    text-align: center;
    padding: 24px;
  }
  /* Bullets laterales: tipografía sans, una línea cada uno */
  .siq-designer-bullets {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column;
    gap: clamp(14px, 1.8cqw, 22px);
    font-family: 'Public Sans', system-ui, sans-serif;
    color: #1c1a18;
  }
  .siq-designer-bullets li {
    display: flex; flex-direction: column;
    gap: 2px;
    font-size: clamp(11px, 1.1cqw, 14px);
    line-height: 1.35;
  }
  .siq-designer-bullets-left  { text-align: right; align-items: flex-end; }
  .siq-designer-bullets-right { text-align: left;  align-items: flex-start; }
  .siq-bullet-key {
    font-size: clamp(9px, 0.9cqw, 11px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(28,26,24,0.55);
    font-weight: 600;
  }
  .siq-bullet-dot { display: none; }
  .siq-bullet-val {
    font-size: clamp(12px, 1.2cqw, 15px);
    font-weight: 500;
    color: #1c1a18;
  }
  /* Caption serif italic debajo del body */
  .siq-designer-caption {
    margin-top: 22px;
    text-align: center;
    font-family: 'Libre Baskerville', Georgia, serif;
    font-style: italic;
    font-size: clamp(13px, 1.4cqw, 17px);
    color: rgba(28,26,24,0.7);
    line-height: 1.4;
  }
  /* Logo Olfativa texto abajo derecha */
  .siq-designer-logo {
    position: absolute;
    right: 28px; bottom: 18px;
    font-family: 'Libre Baskerville', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(11px, 1.1cqw, 14px);
    color: rgba(28,26,24,0.55);
    letter-spacing: 0.04em;
  }

  /* Body (caption + brief contextual) debajo del marco */
  .siq-evidence-body {
    display: flex; flex-direction: column; gap: 8px;
    padding: 0 4px;
  }
  .siq-evidence-brief {
    font-size: 13.5px; line-height: 1.55;
    color: rgba(243,237,227,0.85);
    margin: 0;
    max-width: 920px;
  }

  /* — Override visual del especialista — */
  .siq-visual-overrides {
    background: rgba(243, 237, 227, 0.025);
    border: 1px solid rgba(234, 226, 213, 0.1);
    border-radius: 8px;
    padding: 16px 18px;
  }
  .siq-visual-overrides-head {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    margin-bottom: 14px;
  }
  .siq-visual-overrides-sub {
    font-size: 12px; color: rgba(243, 237, 227, 0.55);
    margin-top: 4px; max-width: 560px; line-height: 1.4;
  }
  .siq-visual-overrides-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }
  .siq-vo-field { display: flex; flex-direction: column; gap: 6px; }
  .siq-vo-label {
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(243, 237, 227, 0.55); font-weight: 500;
  }
  .siq-vo-control {
    appearance: none; font-family: inherit;
    background: rgba(243, 237, 227, 0.06);
    border: 1px solid rgba(234, 226, 213, 0.18);
    color: #F5F0E8; font-size: 13px;
    padding: 9px 11px; border-radius: 5px; outline: none;
  }
  .siq-vo-control:focus { border-color: rgba(199, 166, 104, 0.55); background: rgba(199, 166, 104, 0.06); }

  /* — Result grid — */
  .siq-result { display: flex; flex-direction: column; gap: 20px; }
  .siq-warning {
    background: rgba(196,122,72,0.12);
    border-left: 2px solid #C47A48;
    padding: 10px 14px; font-size: 13px; color: rgba(243,237,227,0.85);
    border-radius: 0 4px 4px 0;
  }
  .siq-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px;
  }
  @media (max-width: 980px) { .siq-grid { grid-template-columns: 1fr; } }
  .siq-card {
    background: rgba(243,237,227,0.03);
    border: 1px solid rgba(243,237,227,0.1);
    border-radius: 8px;
    padding: 22px 24px;
  }
  .siq-card-eyebrow {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #C9A84C; font-weight: 600; margin-bottom: 8px;
  }
  .siq-card-title {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-style: italic; font-size: 26px; line-height: 1.1;
    margin-bottom: 14px;
  }
  .siq-kv {
    display: grid; grid-template-columns: 130px 1fr; gap: 6px 14px;
    margin: 0; font-size: 13px;
  }
  .siq-kv dt { color: rgba(243,237,227,0.5); font-weight: 500; }
  .siq-kv dd { margin: 0; color: #F5F0E8; }
  .siq-kv .siq-est { color: #C47A48; font-style: italic; }

  /* — Aroma cards — */
  .siq-subacorde {
    font-size: 14px; letter-spacing: 0.06em;
    color: #C9A84C; margin-bottom: 18px; text-transform: uppercase;
  }
  .siq-aroma {
    background: rgba(243,237,227,0.04);
    padding: 14px 16px; border-radius: 6px; margin-bottom: 12px;
    border-left: 2px solid rgba(201,168,76,0.4);
  }
  .siq-aroma-principal { border-left-color: #C9A84C; }
  .siq-aroma-alt { border-left-color: rgba(196,122,72,0.6); }
  .siq-aroma-tag {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(243,237,227,0.55); margin-bottom: 4px;
  }
  .siq-aroma-fn { color: #C47A48; }
  .siq-aroma-name {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-style: italic; font-size: 22px; margin-bottom: 4px;
  }
  .siq-aroma-meta { font-size: 12px; color: rgba(243,237,227,0.55); margin-bottom: 8px; }
  .siq-aroma-desc { font-size: 13px; line-height: 1.5; color: rgba(243,237,227,0.8); margin: 6px 0; }
  .siq-notas { font-size: 12px; color: rgba(243,237,227,0.65); margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
  .siq-notas b { color: #C9A84C; font-weight: 600; letter-spacing: 0.05em; }
  .siq-risk { margin: 6px 0; }
  .siq-risk-pill {
    display: inline-block; font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; padding: 3px 10px; border-radius: 999px;
    font-weight: 600;
  }
  .siq-risk-pill.is-bajo { background: rgba(80,150,80,0.18); color: #9CC597; }
  .siq-risk-pill.is-medio { background: rgba(201,168,76,0.18); color: #C9A84C; }
  .siq-risk-pill.is-alto { background: rgba(196,122,72,0.2); color: #C47A48; }
  .siq-justif { font-size: 12.5px; color: rgba(243,237,227,0.7); line-height: 1.5; margin: 8px 0 0; }

  /* — Difusor foto: SIEMPRE contain, fondo #111, padding — */
  .siq-difusor-photo {
    background: #111;
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 14px;
    display: flex; align-items: center; justify-content: center;
    aspect-ratio: 16 / 10;
    max-height: 220px;
  }
  .siq-difusor-photo img {
    width: 100%; height: 100%;
    object-fit: contain; /* nunca cover */
  }
  .siq-block { margin-top: 14px; }
  .siq-block-title {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(243,237,227,0.55); font-weight: 600; margin-bottom: 6px;
  }
  .siq-block ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.55; color: rgba(243,237,227,0.85); }
  .siq-block li { margin-bottom: 4px; }

  /* — Designer prompt — */
  .siq-labels { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .siq-label-chip {
    font-size: 11px; padding: 4px 10px; border-radius: 999px;
    background: rgba(201,168,76,0.12); color: #C9A84C;
    letter-spacing: 0.04em;
  }
  .siq-prompt {
    width: 100%;
    background: #0a0a0a;
    border: 1px solid rgba(243,237,227,0.1);
    color: #F5F0E8;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.55;
    padding: 12px;
    border-radius: 6px;
    resize: vertical;
  }
  .siq-copy { margin-top: 12px; }

  /* — Summary, JSON, actions — */
  .siq-summary {
    background: rgba(201,168,76,0.06);
    border-left: 2px solid #C9A84C;
    padding: 16px 20px; border-radius: 0 6px 6px 0;
  }
  .siq-summary p {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-style: italic; font-size: 17px; line-height: 1.5; margin: 0;
  }
  .siq-json-block { padding-top: 4px; }
  .siq-json-toggle {
    appearance: none; background: transparent; border: 0;
    color: rgba(243,237,227,0.6); font-size: 12px; cursor: pointer;
    padding: 4px 0; letter-spacing: 0.05em;
  }
  .siq-json-toggle:hover { color: #C9A84C; }
  .siq-json {
    background: #0a0a0a;
    border: 1px solid rgba(243,237,227,0.08);
    border-radius: 6px;
    padding: 14px;
    font-size: 11px; line-height: 1.5;
    color: rgba(243,237,227,0.75);
    overflow: auto; max-height: 360px;
    margin-top: 8px;
  }
  .siq-actions {
    display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;
    padding-top: 12px; border-top: 1px solid rgba(243,237,227,0.08);
  }
  .siq-error { padding: 32px; text-align: center; }
  .siq-error p { color: rgba(243,237,227,0.7); margin: 12px 0 20px; }

  /* — Admin panel · tabs (Slides / Catálogo / Visión) — */
  .admin-modal { max-width: 1080px; }
  .admin-tabs {
    display: flex; gap: 4px;
    padding: 0 24px;
    border-bottom: 1px solid rgba(234, 226, 213, 0.1);
    background: rgba(0, 0, 0, 0.18);
  }
  .admin-tab {
    appearance: none; cursor: pointer; font-family: inherit;
    background: transparent; border: 0; outline: none;
    color: rgba(243, 237, 227, 0.55);
    font-size: 12.5px; font-weight: 500;
    padding: 12px 16px;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 160ms, border-color 160ms;
  }
  .admin-tab:hover { color: #F5F0E8; }
  .admin-tab.is-on {
    color: rgba(199, 166, 104, 0.95);
    border-bottom-color: rgba(199, 166, 104, 0.7);
  }

  /* — Catalog editor (pestaña Catálogo de aromas) — */
  .catalog-editor {
    display: flex; flex-direction: column;
    flex: 1; min-height: 0;
  }
  .catalog-editor-body {
    display: grid; grid-template-columns: 320px 1fr;
    gap: 0;
    flex: 1; min-height: 0;
  }
  @media (max-width: 860px) {
    .catalog-editor-body { grid-template-columns: 1fr; }
  }
  .catalog-list {
    display: flex; flex-direction: column;
    border-right: 1px solid rgba(234, 226, 213, 0.1);
    min-height: 0;
  }
  .catalog-list-head {
    display: flex; flex-direction: column; gap: 8px;
    padding: 16px 18px;
    border-bottom: 1px solid rgba(234, 226, 213, 0.1);
  }
  .catalog-search {
    appearance: none; font-family: inherit;
    background: rgba(243, 237, 227, 0.06);
    border: 1px solid rgba(234, 226, 213, 0.18);
    color: #F5F0E8; font-size: 12.5px;
    padding: 8px 10px; border-radius: 4px; outline: none;
  }
  .catalog-search:focus { border-color: rgba(199, 166, 104, 0.55); background: rgba(199, 166, 104, 0.06); }
  .catalog-new-btn { align-self: stretch; }
  .catalog-list-scroll {
    flex: 1; overflow-y: auto;
    padding: 6px 0;
  }
  .catalog-list-item {
    appearance: none; cursor: pointer; font-family: inherit;
    width: 100%; text-align: left;
    background: transparent; border: 0; outline: none;
    padding: 10px 18px;
    border-left: 2px solid transparent;
    transition: background 120ms, border-color 120ms;
    display: flex; flex-direction: column; gap: 2px;
  }
  .catalog-list-item:hover { background: rgba(243, 237, 227, 0.04); }
  .catalog-list-item.is-on {
    background: rgba(199, 166, 104, 0.08);
    border-left-color: rgba(199, 166, 104, 0.7);
  }
  .catalog-list-name {
    font-size: 13px; color: #F5F0E8; font-weight: 500;
  }
  .catalog-list-fam {
    font-size: 10.5px; color: rgba(243, 237, 227, 0.55);
    letter-spacing: 0.02em;
  }
  .catalog-list-count {
    padding: 10px 18px;
    border-top: 1px solid rgba(234, 226, 213, 0.08);
    font-size: 11px; color: rgba(243, 237, 227, 0.5);
  }
  .catalog-empty {
    padding: 24px; text-align: center;
    font-size: 13px; color: rgba(243, 237, 227, 0.5);
    font-style: italic;
  }

  .catalog-form {
    padding: 18px 24px;
    display: flex; flex-direction: column; gap: 14px;
    overflow-y: auto;
    min-height: 0;
  }
  .catalog-form-head { display: flex; flex-direction: column; gap: 4px; }
  .catalog-form-title {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; font-weight: 500; color: #F5F0E8;
    letter-spacing: -0.01em;
  }
  .catalog-form-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px 14px;
  }
  .catalog-field { display: flex; flex-direction: column; gap: 5px; }
  .catalog-field-full { grid-column: 1 / -1; }
  .catalog-label {
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(243, 237, 227, 0.55); font-weight: 500;
  }
  .catalog-input {
    appearance: none; font-family: inherit;
    background: rgba(243, 237, 227, 0.06);
    border: 1px solid rgba(234, 226, 213, 0.18);
    color: #F5F0E8; font-size: 13px;
    padding: 8px 10px; border-radius: 4px; outline: none;
  }
  .catalog-input:focus { border-color: rgba(199, 166, 104, 0.55); background: rgba(199, 166, 104, 0.06); }
  .catalog-textarea {
    font-family: inherit;
    line-height: 1.4;
    resize: vertical;
    min-height: 56px;
  }
  .catalog-form-actions {
    display: flex; gap: 8px; justify-content: flex-end; align-items: center;
    margin-top: 8px; padding-top: 12px;
    border-top: 1px solid rgba(234, 226, 213, 0.1);
  }
  .catalog-delete-btn {
    appearance: none; cursor: pointer; font-family: inherit;
    background: rgba(196, 122, 72, 0.12);
    border: 1px solid rgba(196, 122, 72, 0.4);
    color: #C47A48;
    padding: 8px 14px; border-radius: 4px;
    font-size: 12px; letter-spacing: 0.04em;
    margin-right: auto;
  }
  .catalog-delete-btn:hover { background: rgba(196, 122, 72, 0.22); }

  .catalog-editor-footer {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
    padding: 14px 24px;
    border-top: 1px solid rgba(234, 226, 213, 0.1);
    background: rgba(0, 0, 0, 0.18);
  }
  .catalog-editor-footer-info {
    font-size: 12px; color: rgba(243, 237, 227, 0.55);
    max-width: 540px; line-height: 1.4;
  }
  .catalog-editor-footer-info code {
    font-family: 'Courier New', monospace;
    background: rgba(243, 237, 227, 0.06); padding: 1px 5px; border-radius: 3px;
    font-size: 11px;
  }
  .catalog-editor-footer-btns { display: flex; gap: 8px; }
  .catalog-saved-hint  { color: #8FB37E; font-weight: 600; }
  .catalog-import-error { color: #C47A48; font-weight: 600; }
  .catalog-reset-btn {
    color: rgba(196, 122, 72, 0.92) !important;
    border-color: rgba(196, 122, 72, 0.4) !important;
  }
  .catalog-reset-btn:hover {
    color: #C47A48 !important;
    border-color: rgba(196, 122, 72, 0.7) !important;
    background: rgba(196, 122, 72, 0.08) !important;
  }

  /* ============================================================
     Catalog editor · ronda 6 · 5 sentidos
     ============================================================ */

  /* Filtros encima de la lista */
  .catalog-list-filters {
    display: flex;
    gap: 6px;
    padding: 6px 10px 10px;
  }
  .catalog-filter {
    flex: 1;
    font-size: 11.5px;
    padding: 6px 8px;
    background: rgba(255,255,255,0.04);
    color: #E9DDC8;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 6px;
  }
  .catalog-list-badge {
    margin-left: 6px;
    font-size: 9px;
    letter-spacing: 1px;
    opacity: 0.55;
    font-family: ui-monospace, SFMono-Regular, monospace;
  }
  .catalog-list-badge-completo { color: #8FB37E; opacity: 0.9; }
  .catalog-list-badge-parcial  { color: #D5AB5E; opacity: 0.85; }
  .catalog-list-badge-vacio    { color: rgba(255,255,255,0.35); }

  /* Modal full-screen para edición a fondo */
  .siq-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(8, 6, 4, 0.78);
    backdrop-filter: blur(2px);
    z-index: 1500;
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: 24px;
    overflow-y: auto;
  }
  .siq-modal {
    width: 100%;
    max-width: 1100px;
    background: #14110D;
    border: 1px solid rgba(196, 161, 95, 0.25);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    max-height: calc(100vh - 48px);
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  }
  .siq-modal-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 18px 22px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  .siq-modal-eyebrow {
    font-size: 10.5px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: rgba(196,161,95,0.7);
    margin-bottom: 4px;
  }
  .siq-modal-title {
    font-size: 22px;
    color: #F4E9D2;
    margin: 0 0 4px;
    font-family: 'Cormorant Garamond', Georgia, serif;
  }
  .siq-modal-sub {
    font-size: 12.5px;
    color: rgba(233, 221, 200, 0.65);
  }
  .siq-modal-close {
    background: transparent;
    border: none;
    color: #E9DDC8;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    padding: 0 6px;
  }
  .siq-modal-close:hover { color: #fff; }

  .siq-modal-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 18px 22px 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .siq-modal-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 22px;
    border-top: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
    background: rgba(0,0,0,0.18);
    border-radius: 0 0 14px 14px;
  }
  .siq-modal-foot-info { font-size: 11.5px; color: rgba(233, 221, 200, 0.55); flex: 1; }
  .siq-modal-foot-info code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; }
  .siq-modal-foot-actions { display: flex; gap: 8px; flex-shrink: 0; }

  /* Las 3 secciones con color de fondo distinto */
  .siq-section {
    border-radius: 10px;
    padding: 16px 18px 18px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .siq-section-1 {
    background: rgba(143, 179, 126, 0.06); /* verde claro */
    border-color: rgba(143, 179, 126, 0.22);
  }
  .siq-section-2 {
    background: rgba(213, 171, 94, 0.07);  /* ámbar claro */
    border-color: rgba(213, 171, 94, 0.26);
  }
  .siq-section-3 {
    background: rgba(255,255,255,0.025);    /* gris claro */
    border-color: rgba(255,255,255,0.08);
  }
  .siq-section-title {
    font-size: 14.5px;
    color: #F4E9D2;
    margin: 0 0 6px;
    letter-spacing: 0.2px;
  }
  .siq-section-help {
    font-size: 11.5px;
    color: rgba(233, 221, 200, 0.62);
    margin: 0 0 14px;
    line-height: 1.5;
  }
  .siq-section-help code {
    background: rgba(0,0,0,0.25);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 10.5px;
  }
  .siq-section-help em { color: rgba(196,161,95,0.95); font-style: normal; }

  .siq-section-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 14px;
  }
  @media (max-width: 720px) {
    .siq-section-grid { grid-template-columns: 1fr; }
  }

  .siq-field { display: flex; flex-direction: column; gap: 4px; }
  .siq-field-full { grid-column: 1 / -1; }
  .siq-field-label {
    font-size: 11px;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    color: rgba(233, 221, 200, 0.7);
  }
  .siq-field-input {
    background: rgba(0,0,0,0.30);
    color: #F4E9D2;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 6px;
    padding: 7px 9px;
    font-size: 13px;
    font-family: inherit;
    width: 100%;
  }
  .siq-field-input:focus {
    outline: none;
    border-color: rgba(196,161,95,0.55);
  }
  .siq-field-textarea { resize: vertical; line-height: 1.45; }
  .siq-field-row { display: flex; gap: 16px; padding: 4px 0; }
  .siq-radio { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: #E9DDC8; cursor: pointer; }
  .siq-field-privada .siq-field-label { color: #C47A48; }
  .siq-field-privada .siq-field-input { border-color: rgba(196, 122, 72, 0.35); }

  /* Subsecciones colapsables (1.1 a 1.5) */
  .siq-subsection {
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    margin-top: 10px;
    overflow: hidden;
  }
  .siq-subsection-head {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: transparent;
    border: none;
    color: #F4E9D2;
    font-size: 13px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
  }
  .siq-subsection-head:hover { background: rgba(255,255,255,0.04); }
  .siq-subsection-icon { font-size: 16px; }
  .siq-subsection-num {
    font-family: ui-monospace, SFMono-Regular, monospace;
    color: rgba(196,161,95,0.75);
    font-size: 11px;
    min-width: 28px;
  }
  .siq-subsection-name { flex: 1; }
  .siq-subsection-chevron { color: rgba(255,255,255,0.45); font-size: 11px; }
  .siq-subsection.is-gusto-optional .siq-subsection-name { color: rgba(233, 221, 200, 0.5); }
  .siq-subsection-body {
    padding: 6px 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }

  /* Campo TIPO A · sugerido + override + dot de confianza */
  .siq-tipoa-field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 8px 10px;
    background: rgba(0,0,0,0.20);
    border-radius: 6px;
    border-left: 3px solid rgba(255,255,255,0.10);
  }
  .siq-tipoa-head { display: flex; align-items: center; gap: 8px; }
  .siq-tipoa-label {
    flex: 1;
    font-size: 12px;
    color: #E9DDC8;
    letter-spacing: 0.2px;
  }
  .siq-tipoa-restore {
    background: transparent;
    border: 1px solid rgba(196,161,95,0.30);
    color: rgba(196,161,95,0.85);
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10.5px;
